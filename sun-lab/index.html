  <meta name="apple-mobile-web-app-title" content="태양 연구소">

  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">

<body>
  <a class="skip" href="#screen">학습 화면으로 건너뛰기</a>
  <header class="topbar">
    <a class="brand" href="#lab" aria-label="하준이의 태양 연구소 홈"><img src="assets/icon.svg" width="44" height="44" alt=""><span>하준이의 <b>태양 연구소</b><small>HAJUN’S SUN LAB</small></span></a>
    <div class="header-actions"><span class="xp-pill" id="xp">✧ 0 XP</span><button class="icon-btn" id="sound" aria-label="소리 켜기" aria-pressed="false" title="소리 켜기">♫</button><button class="small-btn" id="install">앱 설치 <span aria-hidden="true">↗</span></button></div>
  </header>
  <div class="shell">
    <div class="hello"><span><i class="status-dot"></i> 하준 연구원, 오늘도 새로운 발견!</span><button class="text-btn" id="help">처음이라면? 사용법 ↗</button></div>
    <nav class="tabs" aria-label="학습 메뉴">
      <button data-tab="lab" class="active" aria-current="page"><span>☀</span> 태양 실험실</button>
      <button data-tab="seasons"><span>◈</span> 계절 탐험</button>
      <button data-tab="game"><span>⚑</span> 도전 게임</button>
      <button data-tab="quiz"><span>✓</span> 확인 퀴즈</button>
      <button data-tab="notes"><span>▤</span> 연구 노트</button>
    </nav>
    <main id="screen" tabindex="-1"></main>
    <footer><div><b>작은 질문에서 시작되는 큰 발견.</b><span>초등 6학년 과학 · 계절의 변화</span></div><button class="text-btn" id="sources">학습 기준 · 참고 자료</button><p id="storage-status">학습 기록은 이 기기의 브라우저에 저장돼요.</p></footer>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div><button class="primary wide" id="close-dialog">알겠어</button></dialog>
  <div id="confetti" aria-hidden="true"></div>
  <noscript><p class="noscript">태양을 움직이려면 브라우저에서 자바스크립트를 켜 주세요.</p></noscript>
